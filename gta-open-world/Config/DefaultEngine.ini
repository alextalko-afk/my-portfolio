[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/OpenWorld.OpenWorld
EditorStartupMap=/Game/Maps/OpenWorld.OpenWorld
GlobalDefaultGameMode=/Script/GTAOpenWorld.GTAOpenWorldGameMode

[/Script/Engine.Engine]
GameEngine=/Script/Engine.GameEngine
GameViewportClientClassName=/Script/Engine.GameViewportClient

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.GenerateMeshDistanceFields=False
; Lumen: this project has no baked lighting anywhere (everything is Movable,
; generated at runtime), which is exactly the fully-dynamic scenario Lumen is
; built for - real bounce light and reflections off the procedural city
; instead of flat ambient fill. HardwareRayTracing=0 keeps it on Software
; Lumen so it doesn't require an RT-capable GPU/driver to just work.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0
r.Shadow.Virtual.Enable=1
